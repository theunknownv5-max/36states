# Builds the Android app (APK) on every push to main, and publishes it on the
# repo's Releases page so you can download it straight onto your phone.
#
# Game server address: set a repository variable GAME_SERVER
# (Settings -> Secrets and variables -> Actions -> Variables), e.g.
# https://three6states.onrender.com . If it is not set, that address is used.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SERVER_ORIGIN: ${{ vars.GAME_SERVER || 'https://three6states.onrender.com' }}
      # Every build is signed with the same key (android-res/pod-release.p12), so new
      # versions install over old ones. A POD_KS_PASS secret, if set, overrides this.
      POD_KS_PASS: ${{ secrets.POD_KS_PASS || 'f32136dc909ac9d2675bd9ab04fb135e' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --include=dev

      - name: Build the game
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Landscape, full screen, icons and splash
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          # Landscape only, keep the screen awake-friendly config changes in the WebView.
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' "$M"
          # Hide the status bar.
          S=android/app/src/main/res/values/styles.xml
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>|' "$S"
          # Our icon and splash instead of Capacitor's defaults.
          R=android/app/src/main/res
          rm -rf "$R/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "android-res/mipmap-$d/ic_launcher.png" "$R/mipmap-$d/ic_launcher.png"
            cp "android-res/mipmap-$d/ic_launcher_round.png" "$R/mipmap-$d/ic_launcher_round.png"
            rm -f "$R/mipmap-$d/ic_launcher_foreground.png"
          done
          find "$R" -name 'splash.png' -exec cp android-res/splash.png {} \;
          grep -n "screenOrientation" "$M"

      - name: App version
        run: |
          G=android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"0.1\"/" "$G"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$G"
          grep -n "versionName\|versionCode" "$G"
          # Sign release builds with the permanent Proof of Duty key.
          cat >> "$G" <<'GRADLE'

          android {
              signingConfigs {
                  pod {
                      storeFile file("../../android-res/pod-release.p12")
                      storeType "pkcs12"
                      storePassword System.getenv("POD_KS_PASS")
                      keyAlias "pod"
                      keyPassword System.getenv("POD_KS_PASS")
                      enableV1Signing true
                      enableV2Signing true
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.pod
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../proof-of-duty.apk

      - name: Check the APK installs (signature and integrity)
        run: |
          set -e
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$AS/zipalign" -c -v 4 proof-of-duty.apk > /dev/null
          "$AS/apksigner" verify --verbose --print-certs proof-of-duty.apk
          "$AS/aapt2" dump badging proof-of-duty.apk | grep -E "^(package|sdkVersion|targetSdkVersion)"
          echo "APK_SHA256=$(sha256sum proof-of-duty.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_MB=$(du -m proof-of-duty.apk | cut -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: proof-of-duty-apk
          path: proof-of-duty.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Proof of Duty V0.1 (Android build ${{ github.run_number }})
          body: |
            **Proof of Duty V0.1** · developed by Tcee 🇳🇬
            1. Tap **proof-of-duty.apk** below (about ${{ env.APK_MB }} MB) — not "Source code".
            2. Wait for the download to finish completely, then open it from your Downloads.
            3. Allow "Install unknown apps" for your browser when asked.
            Needs Android 5.1 or newer. If an older Proof of Duty test build is installed, uninstall it first (one time only).
            SHA-256: `${{ env.APK_SHA256 }}`
            Server: ${{ env.VITE_SERVER_ORIGIN }}
          files: proof-of-duty.apk
          make_latest: true
